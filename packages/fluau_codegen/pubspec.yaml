name: fluau_codegen
description: >-
  Code generator for fluau — @LuaWidget / @LuaCapability CLI and build_runner
  builders that emit Dart serializers, Rust UI glue, and Luau stubs.
version: 0.1.0
homepage: https://github.com/c4rl2s0n/fluau
repository: https://github.com/c4rl2s0n/fluau
issue_tracker: https://github.com/c4rl2s0n/fluau/issues
topics:
  - flutter
  - lua
  - luau
  - code-generation
  - build-runner

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: ^14.1.0
  build: ^4.0.10
  source_gen: ^4.2.4
  code_builder: ^4.4.0
  dart_style: ^3.1.12
  path: ^1.8.0
  yaml: ^3.1.0

dev_dependencies:
  build_runner: ^2.4.14
  build_test: ^3.0.0

executables:
  fluau_codegen: fluau_codegen

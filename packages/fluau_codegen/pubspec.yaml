name: fluau_codegen
description: >-
  Code generator for fluau — CLI that emits Dart serializers, Rust UI glue, and
  Luau stubs for @LuaWidget / @LuaCapability.
version: 0.1.1
homepage: https://github.com/c4rl2s0n/fluau
repository: https://github.com/c4rl2s0n/fluau
issue_tracker: https://github.com/c4rl2s0n/fluau/issues
topics:
  - flutter
  - lua
  - luau
  - code-generation

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: ^14.1.0
  code_builder: ^4.4.0
  dart_style: ^3.1.12
  path: ^1.8.0
  yaml: ^3.1.0

executables:
  fluau_codegen: fluau_codegen

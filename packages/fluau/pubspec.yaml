name: fluau
description: >-
  Sandboxed Luau plugins for Flutter — bridge, permission store, loader, and
  @LuaWidget annotations. Requires a Flutter–Rust bridge (e.g. flutter_rust_bridge)
  and a host-owned UI catalog.
version: 0.1.1
homepage: https://github.com/c4rl2s0n/fluau
repository: https://github.com/c4rl2s0n/fluau
issue_tracker: https://github.com/c4rl2s0n/fluau/issues
documentation: https://github.com/c4rl2s0n/fluau/blob/main/docs/GETTING_STARTED.md
topics:
  - flutter
  - lua
  - luau
  - plugins
  - ffi

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

executables:
  bootstrap: bootstrap

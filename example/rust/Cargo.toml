[package]
name = "rust_lib_luatest"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
lua_plugin_core = { path = "../../crates/lua_plugin_core" }
host_api_macros = { path = "../../crates/host_api_macros" }
mlua = { version = "0.10", features = ["luau", "serialize", "send"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
uuid = { version = "1.0", features = ["v4"] }
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
sha2 = "0.10"
md-5 = "0.10"
bcrypt = "0.17"
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"

[build-dependencies]
host_api_meta = { path = "../../crates/host_api_meta" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

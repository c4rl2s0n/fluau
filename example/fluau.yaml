# Optional workspace config for fluau bootstrap + codegen (paths relative to this file).
# Analogous to flutter_rust_bridge.yaml — points at where stamped glue lives.
# New apps default to src/api/fluau.rs; this example keeps plugin.rs (existing FRB).
# Requires an existing FRB app (flutter_rust_bridge.yaml + Native Assets or Cargokit).

rust:
  crate_root: rust/
  # Stamped #[frb] forward module (thin façade over fluau).
  api_module: src/api/plugin.rs
  # Path (from crate_root) to demo HostAPI sources for Luau stub emission.
  host_apis: src/demo_host

dart:
  # Stamped LuaPluginBridge adapter (imports this app's generated FRB symbols).
  bridge_adapter: lib/fluau_bridge.g.dart
  # Package import prefix used inside the stamped adapter.
  frb_package: luatest
  frb_plugin_import: package:luatest/src/rust/api/plugin.dart

codegen:
  input: lib/
  widgets: lib/widgets/
  luau_out: assets/plugins/_types/

stubs:
  host_d_luau: assets/plugins/_types/host.d.luau
  ui_d_luau: assets/plugins/_types/ui.d.luau

# Pin must match the app's flutter_rust_bridge dependency.
frb_version: "2.13.0"

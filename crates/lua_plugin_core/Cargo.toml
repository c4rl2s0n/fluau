[package]
name = "lua_plugin_core"
version = "0.1.0"
edition = "2021"
description = "Sandboxed Luau plugin runtime (tools only — no bundled HostAPIs or UI catalog)"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
mlua = { version = "0.10", features = ["luau", "serialize", "send"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
host_api_macros = { path = "../host_api_macros" }

[dev-dependencies]
